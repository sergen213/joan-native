name: Release
# Tag vMAJOR.MINOR.PATCH[-pre] -> signed update artifacts + AppImage in a DRAFT GitHub release.
# Updaters ignore drafts: nothing is offered until the owner publishes it after qualification.
# Requires repository secret JOA_UPDATE_SIGNING_KEY (base64 raw 32-byte Ed25519 seed matching
# packaging/release/update_pubkey.txt); see docs/RELEASE_PROCESS.md. Never ships game data.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 120
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake ninja pkgconf python python-cryptography \
            libsodium curl libarchive nlohmann-json openssl zstd sdl3 qt6-base qt6-svg qt6-wayland \
            vulkan-headers vulkan-icd-loader shaderc glslang glm freetype2 ffmpeg openal github-cli file
      - uses: actions/checkout@v4
      - name: Check tag against project version
        run: |
          version=${GITHUB_REF_NAME#v}
          project=$(sed -n 's/^project(joan_native VERSION \([^ ]*\) .*/\1/p' CMakeLists.txt)
          test "${version%%[-+]*}" = "$project" || { echo "Tag $version does not match CMake version $project"; exit 1; }
          case $version in
            *-*) echo "CHANNEL=experimental" >> "$GITHUB_ENV"; echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV" ;;
            *)   echo "CHANNEL=stable" >> "$GITHUB_ENV"; echo "PRERELEASE=" >> "$GITHUB_ENV" ;;
          esac
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "DIST=$RUNNER_TEMP/dist" >> "$GITHUB_ENV"
          echo "STAGE=$RUNNER_TEMP/stage" >> "$GITHUB_ENV"
      - name: Verify signing secret matches embedded public key
        env:
          JOA_UPDATE_SIGNING_KEY: ${{ secrets.JOA_UPDATE_SIGNING_KEY }}
        run: |
          test -n "$JOA_UPDATE_SIGNING_KEY" || { echo "Secret JOA_UPDATE_SIGNING_KEY is not configured"; exit 1; }
          actual=$(python3 packaging/release/sign_manifest.py --public-key)
          test "$actual" = "$(tr -d '[:space:]' < packaging/release/update_pubkey.txt)" \
            || { echo "JOA_UPDATE_SIGNING_KEY does not match packaging/release/update_pubkey.txt"; exit 1; }
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJOA_UPDATE_REPO="$GITHUB_REPOSITORY"
          cmake --build build
          useradd -m ci && chown -R ci: .
          su ci -c "ctest --test-dir build --output-on-failure"
          cmake --install build --prefix "$STAGE"
      - name: Signed update artifacts
        env:
          JOA_UPDATE_SIGNING_KEY: ${{ secrets.JOA_UPDATE_SIGNING_KEY }}
        run: |
          python3 packaging/release/make_release.py --prefix "$STAGE" --version "$VERSION" \
            --channel "$CHANNEL" --output-dir "$DIST"
          python3 packaging/release/sign_manifest.py "$DIST/manifest.json"
      - name: AppImage (pinned linuxdeploy)
        run: |
          tools=$RUNNER_TEMP/tools && mkdir -p "$tools"
          curl --fail --location --proto '=https' --proto-redir '=https' -o "$tools/linuxdeploy" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          curl --fail --location --proto '=https' --proto-redir '=https' -o "$tools/linuxdeploy-plugin-qt" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          printf '%s\n' \
            "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  $tools/linuxdeploy" \
            "15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  $tools/linuxdeploy-plugin-qt" | sha256sum --check
          chmod +x "$tools"/*
          PATH="$tools:$PATH" QMAKE=qmake6 sh packaging/appimage/build_appimage.sh "$STAGE" "$VERSION" "$DIST"
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive --format=tar.gz --prefix="joan-native-$VERSION/" -o "$DIST/joan-native-$VERSION-source.tar.gz" "$GITHUB_REF_NAME"
          (cd "$DIST" && sha256sum -- * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag $PRERELEASE \
            --title "Joan of Arc native $VERSION" --notes "Draft: qualify, then publish. Channel: $CHANNEL." "$DIST"/*
