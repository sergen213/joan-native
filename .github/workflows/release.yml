name: Release
# Tag vMAJOR.MINOR.PATCH[-pre] -> signed update artifacts + AppImage in a DRAFT GitHub release.
# Updaters ignore drafts: nothing is offered until the owner publishes it after qualification.
# Requires repository secret JOA_UPDATE_SIGNING_KEY (base64 raw 32-byte Ed25519 seed matching
# packaging/release/update_pubkey.txt); see docs/RELEASE_PROCESS.md. Never ships game data.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 120
    steps:
      - name: Bootstrap git
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: pacman -S --noconfirm --needed - < packaging/ci/arch-packages.txt
      - name: Check tag against project version
        run: |
          version=${GITHUB_REF_NAME#v}
          project=$(sed -n 's/^project(joan_native VERSION \([^ ]*\) .*/\1/p' CMakeLists.txt)
          test "${version%%[-+]*}" = "$project" || { echo "Tag $version does not match CMake version $project"; exit 1; }
          case $version in
            *-*) echo "CHANNEL=experimental" >> "$GITHUB_ENV"; echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV" ;;
            *)   echo "CHANNEL=stable" >> "$GITHUB_ENV"; echo "PRERELEASE=" >> "$GITHUB_ENV" ;;
          esac
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "DIST=$RUNNER_TEMP/dist" >> "$GITHUB_ENV"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Verify signing secret matches embedded public key
        env:
          JOA_UPDATE_SIGNING_KEY: ${{ secrets.JOA_UPDATE_SIGNING_KEY }}
        run: |
          test -n "$JOA_UPDATE_SIGNING_KEY" || { echo "Secret JOA_UPDATE_SIGNING_KEY is not configured"; exit 1; }
          actual=$(python3 packaging/release/sign_manifest.py --public-key)
          test "$actual" = "$(tr -d '[:space:]' < packaging/release/update_pubkey.txt)" \
            || { echo "JOA_UPDATE_SIGNING_KEY does not match packaging/release/update_pubkey.txt"; exit 1; }
      - name: Cache LGPL FFmpeg + pinned downloads
        uses: actions/cache@v4
        with:
          path: work/tools
          key: release-tools-${{ hashFiles('packaging/ffmpeg/*', 'packaging/appimage/runtime.lock.json', 'packaging/ci/arch-packages.txt') }}
      - name: LGPL FFmpeg (authenticated source, minimal decoders)
        run: test -d work/tools/ffmpeg-prefix || python3 packaging/ffmpeg/build_ffmpeg.py --prefix work/tools/ffmpeg-prefix --tools-dir work/tools
      - name: Build and test against the release FFmpeg
        run: |
          useradd -m ci && chown -R ci: .
          su ci -c "PKG_CONFIG_PATH=$PWD/work/tools/ffmpeg-prefix/lib/pkgconfig cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DJOA_UPDATE_REPO=$GITHUB_REPOSITORY -DJOA_DEV_OVERLAY=ON && cmake --build build \
            && LIBGL_ALWAYS_SOFTWARE=1 ctest --test-dir build --output-on-failure -j4 -E '\.vk_|\.gl_' \
            && LIBGL_ALWAYS_SOFTWARE=1 ctest --test-dir build --output-on-failure -R '\.gl_' --repeat until-pass:2"
      - name: Release artifacts (tarballs, manifest, AppImage, third-party source), signed
        env:
          JOA_UPDATE_SIGNING_KEY: ${{ secrets.JOA_UPDATE_SIGNING_KEY }}
        run: |
          python3 packaging/release/build_release.py --version "$VERSION" --channel "$CHANNEL" \
            --repo "$GITHUB_REPOSITORY" --ffmpeg-prefix work/tools/ffmpeg-prefix \
            --work-dir "$RUNNER_TEMP/release-work" --output-dir "$DIST"
      - name: Verify signature, AppImage and license audit
        run: |
          python3 packaging/release/sign_manifest.py --verify "$DIST/manifest.json"
          mkdir -p "$RUNNER_TEMP/checks" && ln -s "$DIST" "$RUNNER_TEMP/checks/dist" && chown -R ci: "$RUNNER_TEMP/checks"
          su ci -c "python3 tests/release/release_checks.py appimage --out $RUNNER_TEMP/checks \
            && python3 tests/release/release_checks.py license-audit --out $RUNNER_TEMP/checks"
      - name: Source tarball + SHA256SUMS
        run: |
          git archive --format=tar.gz --prefix="joan-native-$VERSION/" -o "$DIST/joan-native-$VERSION-source.tar.gz" "$GITHUB_REF_NAME"
          cd "$DIST" && rm SHA256SUMS && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag $PRERELEASE \
            --title "Joan of Arc native $VERSION" --notes "Draft: qualify, then publish. Channel: $CHANNEL." "$DIST"/*
